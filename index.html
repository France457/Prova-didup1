<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Diario scolastico per compiti, promemoria e studio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/app-180.png">
  <title>Diario scolastico</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #244d70;
      --navy-deep: #203f60;
      --blue: #3282e8;
      --blue-pale: #e8f2ff;
      --red: #f05262;
      --green: #29bd8e;
      --yellow: #ffb900;
      --purple: #8b5ce7;
      --ink: #172f50;
      --muted: #70839c;
      --line: #e8edf4;
      --canvas: #f4f7fb;
      --white: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid #90c3ff; outline-offset: 2px; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 5; display: flex; width: 114px; flex-direction: column;
      padding: 15px 7px; background: linear-gradient(180deg, #285578, #244665 65%, #21435f); color: white;
    }
    .brand { display: grid; justify-items: center; gap: 1px; margin: 0 0 22px; }
    .brand-mark { color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.08em; }
    .brand-mark span { color: #45c399; }
    .brand-caption { color: #d2dfec; font-size: 8px; letter-spacing: .08em; }
    .navigation { display: grid; gap: 4px; overflow-y: auto; scrollbar-width: none; }
    .navigation::-webkit-scrollbar { display: none; }
    .nav-button {
      display: grid; min-height: 48px; justify-items: center; align-content: center; gap: 3px;
      padding: 4px 2px; border: 0; border-radius: 7px; background: transparent; color: #e6eff8;
      cursor: pointer; font-size: 9px; transition: background .2s ease, transform .2s ease;
    }
    .nav-button:hover { transform: translateX(2px); background: rgb(255 255 255 / 10%); }
    .nav-button[aria-current="page"] { background: #397ab5; box-shadow: 0 3px 10px rgb(14 37 60 / 15%); color: white; }
    .nav-icon { font-size: 17px; line-height: 1; }
    .ai-nav { margin-top: auto; padding: 8px; border-top: 1px solid rgb(255 255 255 / 12%); }
    .ai-nav[hidden] { display: none; }
    .exit-ai { min-height: 31px; padding: 0 10px; border: 1px solid #e0e8f3; border-radius: 7px; background: white; color: var(--navy); cursor: pointer; font-size: 10px; font-weight: 700; }
    .exit-ai[hidden] { display: none; }
    .main { min-height: 100vh; margin-left: 114px; }
    .topbar {
      position: sticky; top: 0; z-index: 4; display: flex; height: 60px; align-items: center; gap: 20px;
      padding: 0 22px; border-bottom: 1px solid #e9edf3; background: rgb(255 255 255 / 88%); backdrop-filter: blur(16px);
    }
    .top-brand { display: none; }
    .search-wrap { position: relative; width: min(315px, 38vw); }
    .search-icon { position: absolute; top: 50%; left: 13px; color: #8798ac; font-size: 17px; transform: translateY(-52%); pointer-events: none; }
    .search { width: 100%; height: 38px; padding: 0 13px 0 39px; border: 1px solid transparent; border-radius: 22px; outline: none; background: #f1f4f8; color: var(--ink); font-size: 12px; transition: border .2s, box-shadow .2s, background .2s; }
    .search:focus { border-color: #b7d3f3; background: white; box-shadow: 0 0 0 3px rgb(50 130 232 / 8%); }
    .top-actions { display: flex; align-items: center; gap: 15px; margin-left: auto; }
    .icon-button { position: relative; display: grid; width: 35px; height: 35px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #536b86; cursor: pointer; font-size: 18px; transition: background .2s, color .2s; }
    .icon-button:hover { background: var(--blue-pale); color: var(--blue); }
    .notification-count { position: absolute; top: 1px; right: 1px; display: grid; min-width: 15px; height: 15px; place-items: center; padding: 0 3px; border: 1px solid white; border-radius: 10px; background: var(--red); color: white; font-size: 9px; font-weight: 800; }
    .demo-mode-badge:not([hidden]) { padding: 6px 9px; border: 1px solid #dcd4ff; border-radius: 20px; background: #f2eeff; color: #6e53ce; font-size: 9px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
    .demo-credentials { display: grid; gap: 6px; margin-top: 17px; padding: 13px; border: 1px solid #dfe8f5; border-radius: 9px; background: #f5f8fd; color: #536984; font-size: 11px; line-height: 1.5; }
    .demo-credentials strong { color: #28496b; font-size: 12px; }
    .demo-credentials code { padding: 2px 5px; border-radius: 4px; background: white; color: #304e70; font-family: Consolas, monospace; font-weight: 700; }
    [data-theme="dark"] .demo-mode-badge:not([hidden]) { border-color: #4a417b; background: #30294e; color: #d4caff; }
    [data-theme="dark"] .demo-credentials { border-color: #34435f; background: #17243a; color: #a5b4d2; }
    [data-theme="dark"] .demo-credentials strong { color: #dce7ff; }
    [data-theme="dark"] .demo-credentials code { background: #24324c; color: #e3eaff; }
    .profile { display: flex; align-items: center; gap: 9px; }
    .profile-button { padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; }
    .profile-button:hover .avatar { box-shadow: 0 0 0 4px var(--blue-pale); }
    .avatar { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--blue); color: white; font-size: 13px; font-weight: 700; }
    .profile-name { font-size: 11px; font-weight: 700; }
    .profile-role { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .profile-arrow { margin-left: 2px; color: var(--muted); font-size: 12px; }
    .account-card { max-width: 780px; margin: 0 auto; padding: 25px; }
    .account-intro { display: flex; align-items: center; gap: 15px; margin-bottom: 22px; padding: 18px; border-radius: 12px; background: linear-gradient(120deg, #edf5ff, #f5f0ff); }
    .account-avatar { display: grid; width: 58px; height: 58px; flex: 0 0 58px; place-items: center; border-radius: 50%; background: linear-gradient(140deg, #3282e8, #755be8); box-shadow: 0 6px 16px rgb(50 130 232 / 20%); color: white; font-size: 19px; font-weight: 750; }
    .account-intro h2 { margin: 0; font-size: 16px; }
    .account-intro p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .account-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 11px; font-weight: 700; }
    .field-label { font-size: 11px; font-weight: 700; }
    .field input { width: 100%; min-height: 43px; padding: 0 12px; border: 1px solid #dfe6ef; border-radius: 8px; outline: 0; background: #fbfcfe; color: var(--ink); font-size: 12px; transition: border .18s, box-shadow .18s, background .18s; }
    .field input:focus { border-color: #80b5f0; background: white; box-shadow: 0 0 0 3px rgb(50 130 232 / 10%); }
    .account-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 21px; }
    .save-status { min-height: 18px; margin: 0; color: var(--green); font-size: 11px; }
    .save-status.error { color: var(--red); }
    .save-button { min-height: 41px; padding: 0 19px; border: 0; border-radius: 8px; background: linear-gradient(110deg, #3282e8, #426fe1); box-shadow: 0 5px 12px rgb(50 130 232 / 18%); color: white; cursor: pointer; font-size: 12px; font-weight: 700; transition: transform .18s, box-shadow .18s; }
    .save-button:hover { transform: translateY(-2px); box-shadow: 0 8px 17px rgb(50 130 232 / 25%); }
    .account-note { margin: 17px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .argo-setup { width: min(100%, 620px); margin: 30px auto; padding: 26px; }
    .argo-setup h2 { margin: 0 0 8px; font-size: 17px; }
    .argo-setup-copy { margin: 0 0 20px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .argo-setup-form { display: grid; gap: 15px; }
    .argo-notice { margin: 16px 0 0; padding: 12px; border-radius: 8px; background: #fff8e8; color: #765719; font-size: 10px; line-height: 1.6; }
    .argo-status { min-height: 18px; margin: 0; color: var(--green); font-size: 11px; }
    .argo-status.error { color: var(--red); }
    .argo-onboarding .sidebar, .argo-onboarding .topbar { display: none; }
    .argo-onboarding .main { margin-left: 0; }
    .argo-onboarding .content { display: grid; min-height: 100vh; align-content: center; padding: 24px; }
    .auth-gate { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #e8f2ff, transparent 55%), var(--canvas); }
    .auth-card { width: min(100%, 390px); padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 16px 45px rgb(34 65 97 / 10%); }
    .auth-mark { display: grid; width: 52px; height: 52px; place-items: center; margin-bottom: 18px; border-radius: 15px; background: linear-gradient(140deg, #3282e8, #755be8); color: white; font-size: 24px; font-weight: 800; }
    .auth-card h1 { margin: 0; color: var(--ink); font-size: 21px; }
    .auth-copy { margin: 8px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form[hidden] { display: none; }
    .auth-form label { display: grid; gap: 7px; font-size: 12px; font-weight: 700; }
    .auth-form input { width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid #dfe6ef; border-radius: 8px; background: #fbfcfe; color: var(--ink); font-size: 16px; }
    .auth-submit { min-height: 44px; border: 0; border-radius: 8px; background: linear-gradient(110deg, #3282e8, #426fe1); color: white; cursor: pointer; font-size: 13px; font-weight: 700; }
    .auth-submit:disabled { cursor: wait; opacity: .65; }
    .auth-status { min-height: 18px; margin: 0; color: var(--red); font-size: 12px; line-height: 1.45; }
    .app[hidden], .auth-gate[hidden] { display: none; }
    [data-logout] { padding: 7px 9px; border: 1px solid #e2e8f0; border-radius: 7px; background: white; color: var(--navy); cursor: pointer; font-size: 10px; font-weight: 700; }
    .ai-planner { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .78fr); gap: 18px; align-items: center; overflow: hidden; margin-bottom: 15px; padding: 18px 20px; border-color: #dfe8fa; background: linear-gradient(115deg, #f0f6ff, #f7f2ff 68%, #fff); }
    .ai-planner::after { position: absolute; top: -65px; right: 30%; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, rgb(126 114 238 / 12%), transparent 70%); content: ""; pointer-events: none; }
    .ai-planner-copy, .ai-planner-action { position: relative; z-index: 1; }
    .ai-eyebrow { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 7px; color: #7057cc; font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .ai-planner h2 { margin: 0; font-size: 15px; }
    .ai-planner-copy p { max-width: 430px; margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .ai-planner-action { display: grid; gap: 8px; }
    .api-key-row { display: flex; gap: 7px; }
    .ai-key-box { display: grid; gap: 8px; margin-top: 12px; padding: 12px; border: 1px solid #e7e1ff; border-radius: 10px; background: rgb(250 248 255 / 90%); }
    .ai-key-box label { display: block; color: #4f5c7a; font-size: 10px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
    .api-key-input { width: 100%; min-width: 0; height: 37px; padding: 0 11px; border: 1px solid #dfe4f0; border-radius: 8px; outline: 0; background: rgb(255 255 255 / 85%); color: var(--ink); font-size: 11px; transition: border .18s, box-shadow .18s; }
    .api-key-input:focus { border-color: #9580e9; box-shadow: 0 0 0 3px rgb(139 92 231 / 11%); }
    .ai-key-note { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .ai-button { min-height: 37px; padding: 0 12px; border: 0; border-radius: 8px; background: linear-gradient(110deg, #7659df, #4984e4); box-shadow: 0 4px 11px rgb(97 94 218 / 20%); color: white; cursor: pointer; font-size: 10px; font-weight: 750; white-space: nowrap; transition: transform .18s, box-shadow .18s, opacity .18s; }
    .ai-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 7px 15px rgb(97 94 218 / 25%); }
    .ai-button:disabled { cursor: wait; opacity: .65; }
    .ai-key-note, .ai-status { min-height: 14px; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .ai-status.error { color: var(--red); }
    .ai-status.success { color: var(--green); }
    .ai-plan-result { margin-top: 11px; padding: 13px 15px; border: 1px solid #e7e1fc; border-radius: 9px; background: rgb(255 255 255 / 86%); font-size: 11px; line-height: 1.65; white-space: pre-wrap; }
    .ai-plan-result[hidden] { display: none; }
    .planning-promo { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; overflow: hidden; margin: 0 0 15px; padding: 12px 15px; border: 1px solid #e2e6fb; border-radius: 11px; background: linear-gradient(105deg, #f0f5ff, #f8f1ff 64%, #fff7f0); box-shadow: 0 3px 11px rgb(64 75 132 / 4%); cursor: pointer; text-align: left; transition: transform .2s, box-shadow .2s, border-color .2s; animation: rise-in .45s .04s both; }
    .planning-promo:hover { transform: translateY(-2px); border-color: #cbd1f4; box-shadow: 0 9px 20px rgb(64 75 132 / 10%); }
    .planning-promo-copy { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .planning-promo-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; background: linear-gradient(145deg, #e9e5ff, #e7f1ff); color: #7559dd; font-size: 19px; }
    .planning-promo-title { display: block; color: #263967; font-size: 12px; font-weight: 750; }
    .planning-promo-text { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .planning-promo-action { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; color: #7159d1; font-size: 10px; font-weight: 750; }
    .planning-promo-arrow { font-size: 17px; transition: transform .2s; }
    .planning-promo:hover .planning-promo-arrow { transform: translateX(3px); }
    .planning-page { display: grid; width: min(100%, 920px); gap: 14px; margin: 0 auto; }
    .planning-hero { position: relative; overflow: hidden; padding: 22px; border: 1px solid #e5e4fb; border-radius: 14px; background: linear-gradient(115deg, #f0f5ff, #f5f0ff 58%, #fff6f2); }
    .planning-hero::after { position: absolute; top: -75px; right: 8%; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgb(117 89 221 / 13%), transparent 70%); content: ""; pointer-events: none; }
    .planning-hero > * { position: relative; z-index: 1; }
    .planning-hero h2 { margin: 3px 0 6px; font-size: 18px; }
    .planning-hero p { max-width: 580px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .planning-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, .72fr); gap: 14px; align-items: start; }
    .planning-card { padding: 17px; }
    .planning-card h2 { margin: 0; font-size: 13px; }
    .planning-card > p { margin: 6px 0 13px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .planning-key-row { display: grid; gap: 8px; }
    .planning-key-status { display: flex; align-items: center; gap: 7px; min-height: 17px; margin: 0; color: var(--muted); font-size: 9px; }
    .planning-key-status.connected { color: var(--green); }
    .planning-key-status.error { color: var(--red); }
    .planning-key-status::before { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: currentColor; content: ""; }
    .planning-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ai-secondary-button { min-height: 34px; padding: 0 11px; border: 1px solid #e2e5f0; border-radius: 7px; background: white; color: #6355b6; cursor: pointer; font-size: 10px; font-weight: 700; transition: background .18s, transform .18s; }
    .ai-secondary-button:hover:not(:disabled) { transform: translateY(-1px); background: #f6f3ff; }
    .ai-secondary-button:disabled { cursor: not-allowed; opacity: .5; }
    .planning-result { min-height: 74px; margin-top: 12px; padding: 12px; border: 1px dashed #dcd9f4; border-radius: 8px; background: #fcfbff; color: #394967; font-size: 10px; line-height: 1.65; white-space: pre-wrap; }
    .planning-result:empty::before { color: #99a6b9; content: "Il tuo piano di studio apparirà qui."; }
    .planning-task-list { display: grid; gap: 8px; }
    .planning-task { display: flex; align-items: flex-start; gap: 8px; color: #42536b; font-size: 10px; line-height: 1.45; }
    .planning-task::before { width: 7px; height: 7px; flex: 0 0 7px; margin-top: 4px; border-radius: 50%; background: #8067df; content: ""; }
    .planning-list-heading { margin: 15px 0 8px; color: var(--ink); font-size: 11px; }
    .planning-list-heading { margin: 15px 0 8px; color: var(--ink); font-size: 11px; }
    .chat-shell { display: grid; width: min(100%, 900px); min-height: min(660px, calc(100vh - 190px)); grid-template-rows: auto minmax(180px, 1fr) auto; overflow: hidden; margin: 0 auto; }
    .chat-shell[hidden] { display: none; }
    .chat-shell { display: grid; width: min(100%, 900px); min-height: min(660px, calc(100vh - 190px)); grid-template-rows: auto minmax(180px, 1fr) auto; overflow: hidden; margin: 0 auto; }
    .chat-heading { display: flex; align-items: center; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .chat-heading-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: linear-gradient(140deg, #eee9ff, #e8f2ff); color: #7659df; font-size: 20px; }
    .chat-heading h2 { margin: 0; font-size: 14px; }
    .chat-heading p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .chat-heading .text-button { margin-left: auto; }
    .chat-messages { display: flex; flex-direction: column; gap: 13px; overflow: auto; padding: 19px 20px; }
    .chat-message { display: flex; max-width: min(82%, 610px); align-items: flex-start; gap: 9px; animation: rise-in .24s both; }
    .chat-message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message-avatar { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 50%; background: #eee9ff; color: #7659df; font-size: 12px; font-weight: 750; }
    .chat-message.user .message-avatar { background: var(--blue-pale); color: var(--blue); }
    .message-bubble { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px 12px 12px; background: #f8faff; color: var(--ink); font-size: 11px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.user .message-bubble { border-color: #d7e8ff; border-radius: 12px 4px 12px 12px; background: #edf5ff; }
    .chat-message.loading .message-bubble { color: var(--muted); }
    .chat-composer { padding: 14px 18px 16px; border-top: 1px solid var(--line); background: #fcfdff; }
    .chat-form { display: flex; align-items: flex-end; gap: 9px; }
    .chat-input { width: 100%; min-height: 43px; max-height: 130px; resize: vertical; padding: 11px 12px; border: 1px solid #dfe6ef; border-radius: 9px; outline: 0; background: white; color: var(--ink); font-size: 11px; line-height: 1.5; }
    .chat-input:focus { border-color: #9580e9; box-shadow: 0 0 0 3px rgb(139 92 231 / 10%); }
    .chat-footnote { margin: 8px 2px 0; color: var(--muted); font-size: 9px; }
    .chat-setup { width: min(100%, 560px); margin: 30px auto; padding: 23px; }
    .chat-setup .ai-planner-action { margin-top: 17px; }
    .chat-empty-state { max-width: 360px; margin: auto; padding: 24px 16px; color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; }
    .chat-empty-state .message-avatar { width: 39px; height: 39px; margin: 0 auto 10px; font-size: 17px; }
    .content { width: min(100%, 1440px); margin: 0 auto; padding: 27px 16px 38px; }
    .welcome { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 19px; animation: rise-in .45s both; }
    .page-heading { margin: 0; font-size: clamp(22px, 2.4vw, 27px); letter-spacing: -.035em; }
    .page-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .date-chip { flex: 0 0 auto; padding: 12px 15px; border: 1px solid #e7edf4; border-radius: 12px; background: white; box-shadow: 0 3px 14px rgb(35 64 92 / 3%); font-size: 12px; font-weight: 700; }
    .date-chip span { margin-left: 6px; color: var(--blue); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 17px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    function normalizeSubject(subject) {

      const query = String(text || "").trim();
      if (!query) return "";

      const match = didUpSubjects.find(subject => normalizedQuery.includes(normalizeSubject(subject)));
      if (match) return match;
      return account.subjects.find(subject => normalizedQuery.includes(normalizeSubject(subject))) || "";

          school: typeof savedAccount.school === "string" ? savedAccount.school : "",
          schoolYear: typeof savedAccount.schoolYear === "string" ? savedAccount.schoolYear : "",
          email: typeof savedAccount.email === "string" ? savedAccount.email : "",
          birthDate: typeof savedAccount.birthDate === "string" ? savedAccount.birthDate : "",
          phone: typeof savedAccount.phone === "string" ? savedAccount.phone : "",
          section: typeof savedAccount.section === "string" ? savedAccount.section : "",
          address: typeof savedAccount.address === "string" ? savedAccount.address : "",
          academicYear: typeof savedAccount.academicYear === "string" ? savedAccount.academicYear : "",
          academicYearAuto: savedAccount.academicYearAuto !== false,

          coverImage: typeof savedAccount.coverImage === "string" ? savedAccount.coverImage : "",
          subjects: Array.isArray(savedAccount.subjects) ? savedAccount.subjects.filter(item => typeof item === "string").slice(0, 20) : [],
          targetAverage: typeof savedAccount.targetAverage === "string" ? savedAccount.targetAverage : "",

    account.preferences = {
      ...defaultAccountPreferences,
      ...account.preferences,
      theme: account.preferences.theme === "dark" ? "dark" : "light",
      homeworkNotifications: account.preferences.homeworkNotifications !== false,
      reminderNotifications: account.preferences.reminderNotifications !== false,
      aiPlanning: account.preferences.aiPlanning !== false,
      language: "it"
    };
    account.targetAverage = account.targetAverage.trim() && Number.isFinite(Number(account.targetAverage))
      ? String(Math.min(10, Math.max(1, Number(account.targetAverage))))
      : "";
    if (account.academicYearAuto || !account.academicYear.trim()) {
      account.academicYear = getCurrentAcademicYear();
      account.academicYearAuto = true;
      try {
        localStorage.setItem("diario-account", JSON.stringify(account));
      } catch (error) {
        console.warn("Non è stato possibile salvare l'anno scolastico nel browser.", error);
      }
    }
    document.body.dataset.theme = account.preferences.theme === "dark" ? "dark" : "light";
    try {
      const saved = JSON.parse(localStorage.getItem("diario-argo-completed") || "[]");
      if (Array.isArray(saved) && saved.every(item => typeof item === "string")) completed = new Set(saved);
    } catch (error) {
      console.warn("Non è stato possibile leggere i compiti salvati nel browser.", error);
    }
    try {
      demoMode = localStorage.getItem("diario-demo-mode") === "true";
      const savedArgo = JSON.parse(localStorage.getItem(demoMode ? "diario-demo-argo-data" : "diario-argo-data") || "null");
      if (savedArgo && savedArgo.connected === true
        && savedArgo.data && Array.isArray(savedArgo.data.assignments) && Array.isArray(savedArgo.data.reminders)) {
        const imported = prepareArgoData(savedArgo.data);
        assignments = [...imported.assignments, ...localTasks.map(createLocalAssignment)];
        reminders = [...imported.reminders, ...localReminders.map(createLocalReminder)];
        argoConnected = true;
        argoImportedAt = typeof savedArgo.importedAt === "string" ? savedArgo.importedAt : "";
      }
    } catch (error) {
      console.warn("Non è stato possibile leggere i dati Argo salvati nel browser.", error);
    }
    try {
      const savedTasks = JSON.parse(localStorage.getItem("diario-local-tasks") || "[]");
      if (Array.isArray(savedTasks)) {
        localTasks = savedTasks.filter(task =>
          task && typeof task.id === "string"
          && typeof task.subject === "string" && task.subject.trim()
          && typeof task.title === "string" && task.title.trim()
          && dateFromISO(task.due)
        );
        assignments.push(...localTasks.map(createLocalAssignment));
      }
    } catch (error) {
      console.warn("Non è stato possibile leggere i compiti personali salvati nel browser.", error);
    }
    try {
      const savedReminders = JSON.parse(localStorage.getItem("diario-local-reminders") || "[]");
      if (Array.isArray(savedReminders)) {
        localReminders = savedReminders.filter(item =>
          item && typeof item.id === "string"
          && typeof item.title === "string" && item.title.trim()
          && dateFromISO(item.date)
        );
        reminders.push(...localReminders.map(createLocalReminder));
      }
    } catch (error) {
      console.warn("Non è stato possibile leggere i promemoria personali salvati nel browser.", error);
    }

    function filtered(items) {
      const query = search.value.trim().toLocaleLowerCase("it");
      if (!query) return items;
      return items.filter(item => Object.values(item).some(value => String(value).toLocaleLowerCase("it").includes(query)));
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function dateFromISO(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
    }

    function dayOffsetForISO(value) {
      const date = dateFromISO(value);
      if (!date) return null;
      const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
      const dateUTC = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      return Math.round((dateUTC - todayUTC) / 86_400_000);
    }

    function subjectColor(subject) {
      const existingColor = assignments.find(item => item.subject === subject && item.color)?.color;
      if (existingColor) return existingColor;
      const normalized = subject.toLocaleLowerCase("it");
      if (normalized.includes("mate")) return "#e84fd5";
      if (normalized.includes("fisica") || normalized.includes("scienz")) return "#f45d62";
      if (normalized.includes("storia")) return "#20b88e";
      if (normalized.includes("ingles") || normalized.includes("lingua")) return "#2878ef";
      if (normalized.includes("arte") || normalized.includes("disegno")) return "#f5ad16";
      return "#8050ed";
    }

    function createLocalAssignment(task) {
      const date = dateFromISO(task.due);
      const dayOffset = dayOffsetForISO(task.due);
      return {
        id: task.id,
        subject: task.subject,
        title: task.title,
        detail: task.detail || "",
        due: date ? new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" }).format(date) : "",
        dueISO: task.due,
        dayOffset,
        color: subjectColor(task.subject),
        priority: task.priority || "media",
        source: "local"
      };
    }

    function persistLocalTasks() {
      try {
        localStorage.setItem("diario-local-tasks", JSON.stringify(localTasks));
        return true;
      } catch (error) {
        console.error("Non è stato possibile salvare i compiti personali nel browser.", error);
        return false;
      }
    }

    function createLocalReminder(item) {
      return {
        id: item.id,
        date: item.date,
        dateOffset: dayOffsetForISO(item.date),
        time: item.time || "09:00",
        title: item.title,
        detail: item.detail || "",
        color: "#8b5ce7",
        source: "local"
      };
    }

    function persistLocalReminders() {
      try {
        localStorage.setItem("diario-local-reminders", JSON.stringify(localReminders));
        return true;
      } catch (error) {
        console.error("Non è stato possibile salvare i promemoria personali nel browser.", error);
        return false;
      }
    }

    function prepareArgoData(result) {
      if (!result || !Array.isArray(result.assignments) || !Array.isArray(result.reminders)) {
        throw new Error("Argo ha restituito dati in un formato non valido.");
      }
      const colors = ["#3282e8", "#f05262", "#29bd8e", "#ffb900", "#8b5ce7"];
      const importedAssignments = result.assignments.flatMap((item, index) => {
        const dayOffset = item && dayOffsetForISO(item.due);
        if (dayOffset === null || typeof item.title !== "string" || !item.title.trim()) return [];
        return [{
          id: `argo-task-${index}-${item.due}`,
          subject: typeof item.subject === "string" && item.subject.trim() ? item.subject.trim().slice(0, 120) : "Materia",
          title: item.title.trim().slice(0, 1000),
          detail: "",
          due: new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" }).format(dateFromISO(item.due)),
          dueISO: item.due,
          dayOffset,
          color: colors[index % colors.length],
        }];
      });
      const importedReminders = result.reminders.flatMap((item, index) => {
        const dateOffset = item && dayOffsetForISO(item.date);
        if (dateOffset === null || typeof item.title !== "string" || !item.title.trim()) return [];
        const titleText = item.title.trim().slice(0, 1000);
        const detailText = typeof item.detail === "string" ? item.detail.trim().slice(0, 500) : "";
        return [{
          id: `argo-reminder-${index}-${item.date}`,
          subject: inferSubjectFromText(`${titleText} ${detailText}`) || "Generale",
          date: item.date,
          dateOffset,
          time: typeof item.time === "string" ? item.time.slice(0, 5) : "",
          title: titleText,
          detail: detailText,
          color: "#8b5ce7",
        }];
      });
      return { assignments: importedAssignments, reminders: importedReminders };
    }

    function demoArgoData() {

          { subject: "Scienze", title: "Portare il materiale di scienze", detail: "Quaderno e libro.", date: isoDate(0), time: "08:00" },
          { subject: "Inglese", title: "Interrogazione di inglese", detail: "Ripassare la Unit 3.", date: isoDate(5), time: "10:00" }

    function resizeProfileImage(file, maxWidth, maxHeight) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
          reject(new Error("Scegli un file immagine valido."));
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          reject(new Error("L'immagine supera il limite di 10 MB."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Non è stato possibile leggere l'immagine."));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("Il file selezionato non è un'immagine valida."));
          image.onload = () => {
            const scale = Math.min(maxWidth / image.width, maxHeight / image.height, 1);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const context = canvas.getContext("2d");
            if (!context) {
              reject(new Error("Il browser non può elaborare questa immagine."));
              return;
            }
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          image.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

    function dateGroupLabel(dayOffset) {
      const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + dayOffset);
      const dateText = new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long" }).format(date);
      const relativeDay = dayOffset === 0 ? "Oggi" : dayOffset === 1 ? "Domani" : "";
      return { relativeDay, dateText };
    }

    function groupedByDay(items, offsetKey, renderItem, summarizeGroup = null) {
      const groups = new Map();
      items.forEach(item => {
        if (!groups.has(item[offsetKey])) groups.set(item[offsetKey], []);
        groups.get(item[offsetKey]).push(item);
      });
      return [...groups.entries()]
        .sort(([firstDay], [secondDay]) => firstDay - secondDay)
        .map(([dayOffset, groupItems]) => {
          const { relativeDay, dateText } = dateGroupLabel(dayOffset);
          const summary = summarizeGroup ? summarizeGroup(groupItems) : "";
          return `<section class="day-group"><h3 class="day-group-title">${relativeDay ? `${relativeDay} · ` : ""}<span class="day-group-date">${escapeHTML(dateText)}</span>${summary}</h3><div class="day-group-items">${groupItems.map(renderItem).join("")}</div></section>`;
        }).join("");
    }

      const message = remaining === 0

    function calendarControls() {
      const monthName = new Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" }).format(calendarMonth);
      return `<div class="calendar-controls"><strong>${monthName}</strong><button type="button" data-month-shift="-1" aria-label="Mese precedente">‹</button><button type="button" data-month-shift="1" aria-label="Mese successivo">›</button></div>`;
    }

    function calendarMarkup() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const previousDays = new Date(year, month, 0).getDate();
      let days = "";
      for (let index = 0; index < 42; index += 1) {
        let day;
        let outside = false;
        let cellMonth = month;
        let cellYear = year;
        if (index < firstWeekday) {
          day = previousDays - firstWeekday + index + 1;
          outside = true;
          if (month === 0) { cellMonth = 11; cellYear -= 1; } else cellMonth -= 1;
        } else if (index >= firstWeekday + daysInMonth) {
          day = index - firstWeekday - daysInMonth + 1;
          outside = true;
          if (month === 11) { cellMonth = 0; cellYear += 1; } else cellMonth += 1;
        } else {
          day = index - firstWeekday + 1;
        }
        const isToday = !outside && year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
        const cellDate = new Date(cellYear, cellMonth, day);
        const cellISO = `${cellYear}-${String(cellMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const isTaskCalendar = currentPage === "Compiti" || currentPage === "Compiti passati";
        const isReminderCalendar = currentPage === "Promemoria" || currentPage === "Promemoria passati";
        const calendarSelection = isTaskCalendar ? taskSelectedDate : isReminderCalendar ? reminderSelectedDate : "";
        const isSelected = !outside && (isTaskCalendar || isReminderCalendar ? Boolean(calendarSelection) && calendarSelection === cellISO : day === selectedDay);
        const hasItems = isReminderCalendar
          ? reminders.some(item => item.date === cellISO)
          : assignments.some(item => item.dueISO === cellISO || (item.dueISO == null && item.dayOffset === dayOffsetForISO(cellISO)));
        const itemLabel = isReminderCalendar ? "promemoria" : "compiti";
        days += `<button class="calendar-day ${outside ? "outside" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""} ${hasItems ? "has-tasks" : ""}" data-day="${day}" data-month="${cellMonth}" data-year="${cellYear}" aria-label="${new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" }).format(cellDate)}${hasItems ? `, con ${itemLabel}` : ""}">${day}</button>`;
      }
      return `<div class="calendar-grid" role="grid">${["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"].map(day => `<span class="weekday" role="columnheader">${day}</span>`).join("")}${days}</div>`;
    }

    function homeCalendarMarkup() {

      const month = calendarMonth.getMonth();
      const selectedDate = new Date(year, month, selectedDay);
      const mondayOffset = (selectedDate.getDay() + 6) % 7;
      const weekStart = new Date(year, month, selectedDay - mondayOffset);
      const days = Array.from({ length: 7 }, (_, index) => {
        const date = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + index);
        const isToday = date.toDateString() === today.toDateString();
        const isSelected = date.toDateString() === selectedDate.toDateString();
        return `<button class="calendar-day ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" data-day="${date.getDate()}" data-month="${date.getMonth()}" data-year="${date.getFullYear()}" aria-label="${new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(date)}"><span class="home-weekday">${new Intl.DateTimeFormat("it-IT", { weekday: "short" }).format(date)}</span><span>${date.getDate()}</span></button>`;
      }).join("");
      return `<div class="home-calendar-grid" role="grid">${days}</div>`;

              <button class="home-task-filter" type="button" data-home-reminder-filter="three-days" aria-pressed="${homeReminderFilter === "three-days"}">3 giorni<span class="home-task-filter-count">${filtered(threeDayReminders).length}</span></button>

    function taskDayGroups(items) {

      };

        const dateMatch = !taskSelectedDate || item.dueISO === taskSelectedDate
          || (!item.dueISO && item.dayOffset === dayOffsetForISO(taskSelectedDate));
        return statusMatch && subjectMatch && dateMatch;
      });
      tasks = tasks.sort((a, b) => taskSortOrder === "subject"
        ? a.subject.localeCompare(b.subject, "it") || a.dayOffset - b.dayOffset
        : taskSortOrder === "priority"
          ? ({ alta: 0, media: 1, bassa: 2 }[taskPriority(a)] - { alta: 0, media: 1, bassa: 2 }[taskPriority(b)]) || a.dayOffset - b.dayOffset
          : a.dayOffset - b.dayOffset || a.subject.localeCompare(b.subject, "it"));
      const selectedDate = taskSelectedDate ? dateFromISO(taskSelectedDate) : null;

          </form></dialog>

    function previousRemindersPage() {
      const past = reminders.filter(item => item.dateOffset < 0);
      const searched = filtered(past);
      const activeFilter = ["all", "recent", "older"].includes(reminderFilter) ? reminderFilter : "all";
      const stats = {
        total: searched.length,
        recent: searched.filter(item => item.dateOffset >= -7).length,
        older: searched.filter(item => item.dateOffset < -7).length,
        days: new Set(searched.map(item => item.date)).size
      };
      const filters = [["all", "Tutti"], ["recent", "Ultimi 7 giorni"], ["older", "Più vecchi"]];
      let items = searched.filter(item => {
        const matchesFilter = activeFilter === "all"
          || (activeFilter === "recent" && item.dateOffset >= -7)
          || (activeFilter === "older" && item.dateOffset < -7);
        return matchesFilter && (!reminderSelectedDate || item.date === reminderSelectedDate);
      });
      items = items.sort((a, b) => reminderSortOrder === "title"
        ? a.title.localeCompare(b.title, "it") || a.dateOffset - b.dateOffset
        : reminderSortOrder === "time"
          ? a.dateOffset - b.dateOffset || (a.time || "").localeCompare(b.time || "")
          : a.dateOffset - b.dateOffset || (a.time || "").localeCompare(b.time || ""));
      const selectedDate = reminderSelectedDate ? dateFromISO(reminderSelectedDate) : null;
      const listHeading = selectedDate
        ? `Promemoria passati · ${new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long" }).format(selectedDate)}`
        : activeFilter === "recent" ? "Ultimi 7 giorni"
          : activeFilter === "older" ? "Promemoria più vecchi" : "Tutti i promemoria passati";
      const recentCoverage = past.length ? Math.min(100, Math.round((stats.recent / past.length) * 100)) : 0;
      return `${header("Promemoria passati", "Ripercorri i promemoria delle date già trascorse e controlla cosa è stato già ricordato.")}
        <div class="task-page reminder-page page-enter">
          <div class="task-page-header reminder-page-header"><div><span class="task-page-eyebrow">ARCHIVIO</span><h2>Tutto ciò che è già successo e va tenuto in vista.</h2><p>Controlla il passato per non perdere il ritmo.</p></div></div>
          <section class="task-stats reminder-stats" aria-label="Riepilogo promemoria passati">
            <article class="task-stat"><span class="task-stat-icon all">♟</span><div><strong>${stats.total}</strong><span>Totali</span></div><small>Archivio</small></article>
            <article class="task-stat"><span class="task-stat-icon due">◷</span><div><strong>${stats.recent}</strong><span>Ultimi 7 giorni</span></div><small>Recente</small></article>
            <article class="task-stat"><span class="task-stat-icon open">▦</span><div><strong>${stats.older}</strong><span>Più vecchi</span></div><small>Storico</small></article>
            <article class="task-stat"><span class="task-stat-icon done">→</span><div><strong>${stats.days}</strong><span>Giorni</span></div><small>Con promemoria</small></article>
          </section>
          <div class="task-workspace">
            <section class="card task-main-panel">
              <div class="task-toolbar"><div class="task-filter-tabs reminder-filter-tabs" role="group" aria-label="Filtra promemoria passati">${filters.map(([key, label]) => `<button type="button" data-reminder-filter="${key}" class="${activeFilter === key ? "is-active" : ""}" aria-pressed="${activeFilter === key}">${label}</button>`).join("")}</div>
                <div class="task-view-actions"><label class="task-sort-label" for="reminder-sort">Ordina per</label><select id="reminder-sort" class="task-sort"><option value="date" ${reminderSortOrder === "date" ? "selected" : ""}>Data</option><option value="time" ${reminderSortOrder === "time" ? "selected" : ""}>Orario</option><option value="title" ${reminderSortOrder === "title" ? "selected" : ""}>Titolo</option></select><div class="task-view-toggle" role="group" aria-label="Vista promemoria passati"><button type="button" data-reminder-view="list" class="${reminderViewMode === "list" ? "is-active" : ""}" aria-label="Vista elenco" aria-pressed="${reminderViewMode === "list"}">☰</button><button type="button" data-reminder-view="grid" class="${reminderViewMode === "grid" ? "is-active" : ""}" aria-label="Vista griglia" aria-pressed="${reminderViewMode === "grid"}">▦</button></div></div>
              </div>
              <div class="task-list-heading"><div><h2>${escapeHTML(listHeading)}</h2><p>${items.length} ${items.length === 1 ? "promemoria visualizzato" : "promemoria visualizzati"}</p></div>${reminderSelectedDate ? `<button type="button" class="task-clear-filters" data-clear-reminder-filters>Rimuovi filtro <span>×</span></button>` : ""}</div>
              <div class="task-day-groups">${items.length ? reminderDayGroups(items) : empty("Nessun promemoria passato corrisponde ai filtri selezionati.")}</div>
            </section>
            <aside class="task-side-column">
              <section class="card task-side-panel"><div class="task-side-heading"><h2><span>▦</span> Calendario</h2><button type="button" data-clear-reminder-date aria-label="Mostra tutte le date">Tutti</button></div>${calendarControls()}${calendarMarkup()}<p class="task-calendar-note">${reminderSelectedDate ? `Filtro: ${escapeHTML(new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long" }).format(selectedDate))}` : "Seleziona un giorno per filtrare i promemoria passati."}</p></section>
              <section class="card task-progress-panel reminder-progress-panel"><div class="task-progress-heading"><span>♟</span><div><strong>Archiviato</strong><small>Recap dei promemoria già passati</small></div></div><div class="task-progress-count"><strong>${stats.recent}</strong><span>negli ultimi 7 giorni</span></div><div class="task-progress-track"><span style="width:${recentCoverage}%"></span></div><p>${recentCoverage}% di promemoria recenti</p></section>
            </aside>
          </div>
          <p class="disclaimer">Dati importati da Argo${argoImportedAt ? ` · aggiornati il ${escapeHTML(new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(new Date(argoImportedAt)))}` : ""}</p>
        </div>`;
    }

    function getCurrentAcademicYear(date = new Date()) {
      const firstYear = date.getFullYear() - (date.getMonth() < 8 ? 1 : 0);
      return `${firstYear}/${firstYear + 1}`;
    }

    function profileField(label, name, value, options = {}) {
      const type = options.type || "text";
      const required = options.required ? "required" : "";
      const minMax = type === "number" ? 'min="1" max="10" step="0.1"' : "";
      return `<div class="profile-field"><label for="profile-${name}">${label}</label><input class="profile-input" id="profile-${name}" name="${name}" type="${type}" value="${escapeHTML(value || "")}" readonly ${required} ${minMax} autocomplete="${options.autocomplete || "off"}" aria-label="${label}" title="Clicca per modificare"></div>`;
    }

    function profileCompletion() {
      const checks = [
        ["Dati personali", Boolean(account.firstName.trim() && account.lastName.trim())],
        ["Dati scolastici", Boolean(account.school.trim() && account.schoolYear.trim())],
        ["Preferenze", Boolean(account.preferences && account.preferences.theme)],
        ["Foto profilo", Boolean(account.avatarImage)],
        ["Obiettivo di studio", Boolean(account.studyGoal.trim())]
      ];
      return { checks, percentage: Math.round(checks.filter(([, complete]) => complete).length / checks.length * 100) };
    }

    function updateProfileCompletion() {
      const ring = document.querySelector(".profile-ring");
      if (!ring) return;
      const completion = profileCompletion();
      ring.style.setProperty("--completion", `${completion.percentage}%`);
      ring.querySelector("strong").textContent = `${completion.percentage}%`;
      ring.nextElementSibling.innerHTML = completion.checks.map(([label, complete]) =>
        `<li><span class="profile-check ${complete ? "done" : ""}" aria-hidden="true">${complete ? "✓" : ""}</span>${label}</li>`
      ).join("");
    }

      const completedAssignments = assignments.filter(taskIsComplete).length;

      const profileImage = account.avatarImage
        ? `<img src="${escapeHTML(account.avatarImage)}" alt="Foto profilo">`

    function planningPage() {

        item.dayOffset >= 0 && item.dayOffset < STUDY_PLAN_WINDOW_DAYS && !taskIsComplete(item)
      );
      const upcomingReminders = reminders.filter(item =>
        item.dateOffset >= 0 && item.dateOffset < STUDY_PLAN_WINDOW_DAYS
      );
      const geminiKeySetup = `
        <div class="ai-key-box">
          <label for="gemini-api-key">Chiave API Gemini</label>

          <div class="ai-key-box" style="margin: 14px"><label for="gemini-api-key-chat">Sostituisci chiave API Gemini</label><div class="api-key-row"><input id="gemini-api-key-chat" class="api-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="Incolla una nuova chiave Gemini API" ${geminiKeySaving ? "disabled" : ""}><button class="ai-button" type="button" data-save-gemini-key ${geminiKeySaving ? "disabled" : ""}>${geminiKeySaving ? "Verifica in corso…" : "Verifica e salva"}</button></div><p class="ai-key-note">La nuova chiave sostituisce quella attuale soltanto se supera il test.</p><p class="ai-status ${geminiKeyStatus.startsWith("Errore") ? "error" : ""}" role="status">${escapeHTML(geminiKeyStatus)}</p></div>

    function isoDateForOffset(offset) {
      const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function parseGeneratedPlan(responseText, planningData, validateCoverage = true) {
      const jsonText = responseText.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
      const parsed = JSON.parse(jsonText);
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.days)) {
        throw new Error("L'AI non ha restituito il piano nel formato previsto. Prova a rigenerarlo.");
      }
      const validDates = new Set(planningData.dates);
      const validSources = new Set(planningData.sources.map(source => source.id));
      const days = new Map();
      for (const day of parsed.days) {
        if (!day || !validDates.has(day.date)) continue;
        const sessions = Array.isArray(day.sessions) ? day.sessions.flatMap(session => {
          if (!session || typeof session !== "object") return [];
          const sourceIds = Array.isArray(session.sourceIds)
            ? [...new Set(session.sourceIds.filter(id => typeof id === "string" && validSources.has(id)))]
            : [];
          if (!sourceIds.length) return [];
          const durationMinutes = Number(session.durationMinutes);
          return [{
            sourceIds,
            objective: typeof session.objective === "string" ? session.objective.trim() : "",
            durationMinutes: Number.isFinite(durationMinutes) ? Math.min(90, Math.max(10, Math.round(durationMinutes))) : 25,
            effort: ["leggero", "medio", "impegnativo"].includes(session.effort) ? session.effort : "medio",
            reason: typeof session.reason === "string" ? session.reason.trim() : ""
          }];
        }) : [];
        days.set(day.date, {
          date: day.date,
          focus: typeof day.focus === "string" ? day.focus.trim() : "",
          sessions: [...(days.get(day.date)?.sessions || []), ...sessions]
        });
      }
      const scheduledSourceIds = new Set([...days.values()].flatMap(day => day.sessions.flatMap(session => session.sourceIds)));
      const missingTasks = planningData.tasks.filter(task => !scheduledSourceIds.has(task.id));
      if (validateCoverage && missingTasks.length) {
        const missingTitles = missingTasks.slice(0, 3).map(task => task.title).join(", ");
        throw new Error(`L'AI non ha ancora distribuito ${missingTasks.length} ${missingTasks.length === 1 ? "compito" : "compiti"} su ${planningData.tasks.length}${missingTitles ? ` (per esempio: ${missingTitles})` : ""}. Riprova a generare il piano.`);
      }
      const lateTasks = validateCoverage ? planningData.tasks.filter(task =>
        task.daysUntilDue > 0 &&
        ![...days.values()].some(day =>
          (task.daysUntilDue === 1 ? day.date <= task.date : day.date < task.date) &&
          day.sessions.some(session => session.sourceIds.includes(task.id))
        )
      ) : [];
      if (lateTasks.length) {
        throw new Error(`L'AI non ha distribuito ${lateTasks.length === 1 ? "un compito" : `${lateTasks.length} compiti`} prima della scadenza. Riprova a generare il piano.`);
      }
      return {
        summary: typeof parsed.summary === "string" ? parsed.summary.trim() : "",
        days: planningData.dates.map(date => days.get(date) || { date, focus: "", sessions: [] }),
        reasons: Array.isArray(parsed.reasons)
          ? parsed.reasons.filter(item => typeof item === "string" && item.trim()).slice(0, 8)
          : [],
        missingInfo: Array.isArray(parsed.missingInfo)
          ? parsed.missingInfo.filter(item => typeof item === "string" && item.trim()).slice(0, 8)
          : []
      };
    }

              <article class="study-plan-stat study-plan-stat-completion"><span class="study-plan-stat-icon">✓</span><div class="study-plan-stat-completion-copy"><strong>In analisi</strong><small>compiti da distribuire</small></div><span class="study-plan-completion-ring" style="--completion-rate:0%" aria-label="Distribuzione in corso"></span></article>
            </section>

            <aside class="study-plan-side study-plan-insights">
              <section class="study-plan-panel"><h3>Organizzazione delle attività</h3><div class="study-plan-loading"><span class="study-plan-loader" aria-hidden="true"></span><strong id="generated-plan-progress">${escapeHTML(planningStage || "Raccolta dei dati del diario…")}</strong><p>${planningStreamCharacters ? `${planningStreamCharacters} caratteri ricevuti da Gemini. ` : ""}Sto analizzando compiti, scadenze e promemoria per distribuirli nella settimana.</p><div class="study-plan-progress" aria-hidden="true"><span></span></div><div class="study-plan-loading-steps"><span>Dati raccolti</span><span>Scadenze in analisi</span><span>Planning in preparazione</span></div></div></section>
              <section class="study-plan-panel"><h3>Dati inviati all'AI</h3><div class="study-plan-results"><div class="study-plan-result"><strong>${tasks.length} compiti</strong><span>non completati nella settimana</span></div><div class="study-plan-result"><strong>${reminders.length} promemoria</strong><span>registrati nel periodo</span></div></div></section>
            </aside>
          </div>
          <footer class="study-plan-footer"><p class="study-plan-footer-copy"><strong>Sto preparando il tuo planning settimanale.</strong><br>Le attività e le scadenze mostrate provengono dal diario.</p><div class="study-plan-actions"><button class="ai-secondary-button" type="button" data-go="Promemoria">Gestisci impegni</button><button class="ai-secondary-button" type="button" data-print-plan>Esporta PDF</button><button class="ai-secondary-button" type="button" data-back-planning>← Planning</button></div></footer>
        </div>`;
      }
      if (!generatedPlan || !generatedPlanInput) {
        return `${header("Piano non disponibile", "Non è stato possibile completare il piano richiesto.")}<section class="card generated-plan-loading"><strong>${escapeHTML(planningStatus || "Si è verificato un errore.")}</strong><div class="generated-plan-actions"><button class="ai-secondary-button" type="button" data-back-planning>Torna al Planning</button><button class="ai-button" type="button" data-regenerate-plan>Riprova</button></div></section>`;
      }

      const sources = generatedPlanInput.sources;
      const sourceMap = new Map(sources.map(source => [source.id, source]));
      const scheduledSessions = generatedPlan.days.flatMap(day => day.sessions);
      const plannedSources = new Set(scheduledSessions.flatMap(session => session.sourceIds));
      const taskSources = sources.filter(source => source.kind === "task");
      const reminderSources = sources.filter(source => source.kind === "reminder");
      const plannedTasks = taskSources.filter(source => plannedSources.has(source.id));
      const unplannedTasks = taskSources.filter(source => !plannedSources.has(source.id));
      const tasksDueSoon = taskSources.filter(source => {
        const daysUntilDue = dayOffsetForISO(source.date);
        return daysUntilDue !== null && daysUntilDue <= 3;
      });
      const subjects = [...new Set(taskSources.map(source => source.subject).filter(Boolean))];
      const totalMinutes = scheduledSessions.reduce((total, session) => total + session.durationMinutes, 0);
      const dailyMinutes = generatedPlan.days.map(day => day.sessions.reduce((total, session) => total + session.durationMinutes, 0));
      const maximumDailyMinutes = Math.max(0, ...dailyMinutes);
      const completionRate = taskSources.length ? Math.round(plannedTasks.length / taskSources.length * 100) : null;
      const durationLabel = totalMinutes >= 60
        ? `${Math.floor(totalMinutes / 60)}h${totalMinutes % 60 ? ` ${totalMinutes % 60}m` : ""}`
        : `${totalMinutes} min`;
      const viewSize = planViewMode === "week" ? 7 : 11;
      const lastStart = Math.floor(Math.max(0, generatedPlan.days.length - 1) / viewSize) * viewSize;
      planViewStart = Math.min(Math.max(0, planViewStart), lastStart);
      const visibleDays = generatedPlan.days.slice(planViewStart, planViewStart + viewSize);
      const unplannedDays = visibleDays.filter(day => day.sessions.length === 0).length;
      const firstVisibleDate = dateFromISO(visibleDays[0]?.date || generatedPlanInput.today);

      const visibleSourceList = sources.filter(source => visibleDays.some(day => day.date === source.date));

    async function generateStudyPlan() {
      if (!geminiApiConfigured || planningBusy) return;
      planningBusy = true;
      planningStatus = "Raccolta delle scadenze e pianificazione in corso…";
      planningStage = "Raccolta dei dati del diario…";
      planningStreamCharacters = 0;
      planningFallback = false;
      planSaveStatus = "";
      generatedPlan = null;
      generatedPlanInput = null;
      planViewStart = 0;
      currentPage = "Piano generato";
      aiMode = true;
      window.scrollTo({ top: 0, behavior: "instant" });
      const tasks = assignments
        .filter(item =>
          item.dayOffset >= 0 &&
          item.dayOffset < STUDY_PLAN_WINDOW_DAYS &&
          !taskIsComplete(item)
        )
        .map((item, index) => ({
          id: `task-${index}`,
          kind: "task",
          subject: item.subject,
          title: item.title,
          details: item.detail,
          date: isoDateForOffset(item.dayOffset),
          daysUntilDue: item.dayOffset
        }));
      const futureReminders = reminders
        .filter(item =>
          item.dateOffset >= 0 &&
          item.dateOffset < STUDY_PLAN_WINDOW_DAYS
        )
        .map((item, index) => ({
          id: `reminder-${index}`,
          kind: "reminder",
          subject: item.subject || "",
          title: item.title,
          details: item.detail,
          date: isoDateForOffset(item.dateOffset),
          time: item.time || "",
          daysUntil: item.dateOffset
        }));
      const sources = [...tasks, ...futureReminders];
      const dates = Array.from(
        { length: STUDY_PLAN_WINDOW_DAYS },
        (_, index) => isoDateForOffset(index)
      );
      const planningData = {
        today: isoDateForOffset(0),
        schoolYear: account.schoolYear || "non indicato",
        studyPreferences: {
          goal: account.studyGoal || "",
          targetAverage: account.targetAverage || "",
          subjects: account.subjects
        },
        dates,
        tasks,
        reminders: futureReminders,
        sources: sources.map(({ id, kind, subject, title, details, date, time }) => ({ id, kind, subject, title, details, date, time }))
      };
      generatedPlanInput = planningData;
      generatedPlan = {
        summary: "",
        days: dates.map(date => ({ date, focus: "", sessions: [] })),
        reasons: [],
        missingInfo: []
      };
      render();
      if (!sources.length) {
        generatedPlan = {
          summary: `Non risultano compiti non completati o promemoria per oggi e i sei giorni successivi. Le attività successive al ${isoDateForOffset(STUDY_PLAN_WINDOW_DAYS - 1)} e precedenti a oggi non sono incluse in questo planning.`,
          days: dates.map(date => ({ date, focus: "", sessions: [] })),
          reasons: ["Il piano considera le attività attualmente registrate nel diario."],
          missingInfo: []
        };
        planningStatus = "Nessun compito o promemoria da pianificare in questa settimana.";
        planningBusy = false;
        render();
        return;
      }
      const planSystemInstruction = `Sei un assistente che distribuisce compiti scolastici tra le date disponibili. Rispondi esclusivamente con JSON valido, senza markdown, in questo formato:
{"allocations":[{"id":"task-0","date":"YYYY-MM-DD"}]}

Devi restituire una sola allocation per ogni ID di tasks, senza saltare o rinominare ID. Scegli solo una delle date in availableDates e non assegnare dopo la scadenza indicata in deadline. Usa materia, titolo e contenuto per distribuire i compiti nei giorni, bilanciando il carico e dando priorità alle scadenze vicine. I promemoria servono solo a evitare impegni registrati. Non aggiungere campi, descrizioni, motivazioni o testo extra.`;
      planningStage = "Gemini sta scegliendo in quali giorni mettere i compiti…";
      render();
      const compactTasks = tasks.map(({ id, subject, title, details, date }) => ({
        id, subject, title, content: details, deadline: date
      }));
      const compactReminders = futureReminders.map(({ subject, title, details, date, time }) => ({
        subject, title, content: details, date, time
      }));
      let createAutomaticAllocations;
      let compilePlan;
      try {
        const requestData = {
          availableDates: dates,
          tasks: compactTasks,
          reminders: compactReminders
        };
        const missingIds = allocations => {
          const plannedIds = new Set(allocations.map(item => item.id));
          return compactTasks.filter(task => !plannedIds.has(task.id));
        };
        const validAllocations = (items, tasksToPlan) => {
          const taskById = new Map(tasksToPlan.map(task => [task.id, task]));
          const seen = new Set();
          return items.filter(item => {
            const task = item && typeof item.id === "string" ? taskById.get(item.id) : null;
            if (!task || seen.has(item.id) || !dates.includes(item.date) || item.date > task.deadline) return false;
            seen.add(item.id);
            return true;
          });
        };
        createAutomaticAllocations = tasksToPlan => {
          const dailyCounts = new Map(dates.map(date => [date, 0]));
          return [...tasksToPlan]
            .sort((left, right) => left.deadline.localeCompare(right.deadline) || left.id.localeCompare(right.id))
            .map(task => {
              const latestDayIndex = Math.max(0, dates.indexOf(task.deadline));
              const eligibleDates = dates.slice(0, latestDayIndex + 1);
              const plannedDate = eligibleDates.reduce((bestDate, date) =>
                dailyCounts.get(date) < dailyCounts.get(bestDate) ? date : bestDate
              , eligibleDates[0]);
              dailyCounts.set(plannedDate, dailyCounts.get(plannedDate) + 1);
              return { id: task.id, date: plannedDate };
            });
        };
        compilePlan = (allocations, summary, reasons = [], missingInfo = []) => {
          const daysByDate = new Map(dates.map(date => [date, { date, focus: "", sessions: [] }]));
          for (const allocation of allocations) {
            const day = daysByDate.get(allocation.date);
            if (!day) continue;
            const task = tasks.find(item => item.id === allocation.id);
            const objective = typeof allocation.objective === "string" && allocation.objective.trim()
              ? allocation.objective.trim()
              : `${task.subject}: ${task.title}${task.details ? ` — ${task.details}` : ""}`;
            day.sessions.push({
              sourceIds: [allocation.id],
              objective,
              durationMinutes: allocation.durationMinutes,
              effort: allocation.effort,
              reason: allocation.reason
            });
          }
          return parseGeneratedPlan(JSON.stringify({
            summary,
            days: [...daysByDate.values()],
            reasons,
            missingInfo
          }), planningData);
        };
        const callPlanner = async tasksToPlan => {
          const promptData = requestData;
          planningStage = "Gemini sta scegliendo in quali giorni mettere i compiti…";
          const progress = document.querySelector("#generated-plan-progress");
          if (progress) progress.textContent = planningStage;
          const responseText = await askGemini([{
            role: "user",
            parts: [{ text: `Distribuisci tutti i compiti del planning. Per ogni ID in tasks restituisci una sola allocation con il relativo id e la data, rispettando la scadenza e considerando gli impegni dei promemoria. Risposta compatta.\n\nDATI:\n${JSON.stringify(promptData)}` }]
          }], planSystemInstruction, chunk => {
            planningStreamCharacters += chunk.length;
            const progressText = document.querySelector("#generated-plan-progress");
            if (progressText) progressText.textContent = `${planningStage} · ${planningStreamCharacters} caratteri ricevuti`;
          }, {
            maxOutputTokens: Math.min(2200, 512 + tasksToPlan.length * 48),
            jsonResponse: true,
            onStatus: message => {
              planningStage = message;
              const status = document.querySelector("#generated-plan-progress");
              if (status) status.textContent = message;
            }
          });
          const cleaned = responseText.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
          let result;
          try {
            result = JSON.parse(cleaned);
          } catch (error) {
            if (error instanceof SyntaxError) {
              throw new Error("Gemini ha restituito una risposta incompleta. Nessun compito è stato perso: attendi un momento e riprova.");
            }
            throw error;
          }
          if (!result || typeof result !== "object" || !Array.isArray(result.allocations)) {
            throw new Error("L'AI non ha restituito l'elenco delle attività pianificate. Riprova.");
          }
          return result;
        };
        const aiResult = await callPlanner(compactTasks);
        let allocations = validAllocations(aiResult.allocations, compactTasks);
        const missing = missingIds(allocations);
        if (missing.length) {
          allocations = [...allocations, ...createAutomaticAllocations(missing)];
          planningFallback = true;
        }
        const summary = planningFallback
          ? "Gemini ha suggerito una parte del piano; le attività mancanti sono state distribuite automaticamente per non lasciarle fuori."
          : "Gemini ha assegnato i compiti ai giorni della settimana.";
        const reasons = planningFallback
          ? ["Le assegnazioni mancanti sono state distribuite automaticamente in base alle scadenze."]
          : ["Le date sono state suggerite dall'AI rispettando le scadenze dei compiti."];
        generatedPlan = compilePlan(allocations, summary, reasons);
        planningStatus = planningFallback
          ? "Piano completato; alcune assegnazioni sono automatiche perché Gemini non le ha restituite."
          : "Piano settimanale creato dall'AI.";
        planningStage = "Piano pronto.";
      } catch (error) {
        planningFallback = true;
        const automaticAllocations = createAutomaticAllocations(compactTasks);
        const errorMessage = error instanceof Error ? error.message : String(error);
        const fallbackReason = errorMessage.includes("429") || errorMessage.includes("RESOURCE_EXHAUSTED")
          ? "La quota di richieste Gemini è esaurita."
          : errorMessage.includes("503") || errorMessage.includes("UNAVAILABLE")
            ? "Gemini è momentaneamente non disponibile."
            : "Gemini non ha completato la risposta.";
        generatedPlan = compilePlan(
          automaticAllocations,
          `${fallbackReason} Ho distribuito automaticamente i compiti della settimana, rispettando le scadenze.`,
          [fallbackReason, "La distribuzione automatica tiene conto delle scadenze, ma non è una scelta generata dall'AI."]
        );
        planningStatus = `${fallbackReason} Il planning settimanale è pronto con una distribuzione automatica.`;
        planningStage = "Planning pronto con distribuzione automatica.";
      } finally {
        planningBusy = false;
        if (currentPage === "Piano generato") render();
      }
    }

    async function askGemini(contents, systemInstruction, onChunk = () => {}, options = {}) {
      if (!account.preferences.aiPlanning) throw new Error("Hai disattivato l'IA per la pianificazione nelle preferenze del profilo.");
      if (!geminiApiConfigured) throw new Error("Gemini non è configurato. Inserisci la chiave API nella sezione AI.");
      const response = await fetch("/api/gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
        body: JSON.stringify({
          model: "gemini-3.8-free",
          systemInstruction,
          contents,
          ...(Number.isInteger(options.maxOutputTokens) ? { maxOutputTokens: options.maxOutputTokens } : {}),
          ...(options.jsonResponse === true ? { jsonResponse: true } : {})
        })
      });
      if (!response.ok) {
        const result = await response.json();
        if (response.status === 401 || response.status === 403) await refreshAppConfig();
        const message = result?.error || `La richiesta a Gemini non è riuscita (HTTP ${response.status}).`;
        throw new Error(message);
      }
      if (!response.body) throw new Error("Il browser non supporta la ricezione della risposta in streaming.");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";
      let streamError = "";
      const processEvent = eventText => {
        const data = eventText.split("\n")
          .filter(line => line.startsWith("data:"))
          .map(line => line.slice(5).trimStart())
          .join("\n");
        if (!data) return;
        const event = JSON.parse(data);
        if (event.retrying === true && typeof event.message === "string") {
          if (typeof options.onStatus === "function") options.onStatus(event.message);
          return;
        }
        if (event.error) {
          streamError = event.error;
          return;
        }
        if (typeof event.text === "string" && event.text) {
          text += event.text;
          onChunk(event.text);
        }
      };
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop() || "";
        for (const eventText of events) processEvent(eventText);
        if (done) break;
      }
      if (buffer.trim()) processEvent(buffer);
      if (streamError) throw new Error(streamError);
      text = text.trim();
      if (!text) throw new Error("Gemini ha restituito una risposta vuota. Riprova.");
      return text;
    }

    async function refreshAppConfig() {
      const authGate = document.querySelector("#auth-gate");
      const appElement = document.querySelector(".app");
      const form = document.querySelector("#auth-form");
      const authStatus = document.querySelector("#auth-status");
      try {
        const response = await fetch("/api/config", { cache: "no-store" });
        const config = await response.json();
        if (!response.ok) throw new Error(config?.error || `Errore HTTP ${response.status}.`);
        csrfToken = config.csrfToken || "";
        localAuthBypass = config.localAuthBypass === true;
        geminiApiConfigured = config.configured === true;
        geminiConfigError = "";
        if (config.setupRequired) {
          appElement.hidden = true;
          authGate.hidden = false;
          document.querySelector("#auth-title").textContent = "Configurazione necessaria";
          document.querySelector("#auth-copy").textContent = "Prima della pubblicazione, imposta SESSION_SECRET, APP_PASSWORD e GEMINI_API_KEY nelle variabili segrete dell'hosting.";
          form.hidden = true;
          authStatus.textContent = "";
          return;
        }
        if (!config.authenticated) {
          wasAuthenticated = false;
          appElement.hidden = true;
          authGate.hidden = false;
          document.querySelector("#auth-title").textContent = "Diario scolastico";
          document.querySelector("#auth-copy").textContent = "Accedi per aprire il diario e usare l'assistente AI.";
          form.hidden = false;
          authStatus.textContent = "";
          document.querySelector("#app-password").focus();
          return;
        }
        if (!wasAuthenticated) {
          wasAuthenticated = true;
          returnToAccountAfterArgo = true;
          currentPage = "Account";
          aiMode = false;
        }
        authGate.hidden = true;
        appElement.hidden = false;
        geminiConfigLoaded = true;
        render();
      } catch (error) {
        appElement.hidden = true;
        authGate.hidden = false;
        document.querySelector("#auth-title").textContent = "Sito non raggiungibile";
        document.querySelector("#auth-copy").textContent = "Controlla la connessione e riprova. Per l'accesso da telefono e PC, il progetto deve essere pubblicato su un hosting HTTPS.";
        form.hidden = true;
        authStatus.textContent = error.message;
        console.error("Non è stato possibile verificare la configurazione dell'app.", error);
      } finally {
        geminiConfigLoaded = true;
      }
    }

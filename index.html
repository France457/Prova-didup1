          localStorage.setItem("diario-demo-argo-data", JSON.stringify({
            connected: true,
            importedAt,
            data
          }));
          localStorage.setItem("diario-demo-mode", "true");
          assignments = [...imported.assignments, ...localTasks.map(createLocalAssignment)];
          reminders = [...imported.reminders, ...localReminders.map(createLocalReminder)];
          argoConnected = true;
          demoMode = true;
          argoImportedAt = importedAt;
          argoSyncStatus = "Modalità demo attiva: stai usando dati di esempio, non dati reali di Argo.";
          if (!wasConnected) {
            currentPage = returnToAccountAfterArgo ? "Account" : "Home";
            returnToAccountAfterArgo = false;
          }
          form.reset();
          render();
        } catch (error) {
          argoSyncFailed = true;
          argoSyncStatus = `Avvio demo non riuscito: ${error.message}`;
          status.textContent = argoSyncStatus;
          status.classList.add("error");
          console.error("Non è stato possibile avviare la modalità demo.", error);
          submitButton.disabled = false;
        }
        return;
      }
      status.textContent = "Connessione ad Argo e importazione in corso…";
      try {
        const response = await fetch("/api/argo/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
          body: JSON.stringify({
            schoolCode,
            username,
            password,
          }),
        });
        const result = await response.json();
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) await refreshAppConfig();
          throw new Error(result?.error || `Importazione non riuscita (HTTP ${response.status}).`);
        }
        const imported = prepareArgoData(result);
        const importedAt = new Date().toISOString();
        localStorage.setItem("diario-argo-data", JSON.stringify({
          connected: true,
          importedAt,
          data: result,
        }));
        localStorage.removeItem("diario-demo-mode");
        assignments = [...imported.assignments, ...localTasks.map(createLocalAssignment)];
        reminders = [...imported.reminders, ...localReminders.map(createLocalReminder)];
        argoConnected = true;
        demoMode = false;
        argoImportedAt = importedAt;
        argoSyncStatus = `Importazione completata: ${assignments.length} compiti e ${reminders.length} promemoria.`;
        argoSyncFailed = false;
        if (!wasConnected) {
          currentPage = returnToAccountAfterArgo ? "Account" : "Home";
          returnToAccountAfterArgo = false;
        }
        document.querySelector("#argo-password").value = "";
        render();
      } catch (error) {
        argoSyncFailed = true;
        argoSyncStatus = `Importazione non riuscita: ${error.message}`;
        status.textContent = argoSyncStatus;
        status.classList.add("error");
        console.error("Non è stato possibile importare i dati da Argo.", error);
      } finally {
        submitButton.disabled = false;
      }
    }

    function placeholderPage(name) {
      return `${header(name, "Sezione disponibile nell'anteprima del diario scolastico.")}<section class="card panel page-enter">${sectionHeading(name, "▤", "Home", "Torna alla Home")}<p class="empty">Questa anteprima contiene soltanto compiti, promemoria e calendario.</p></section>`;
    }

    function render() {
      const appElement = document.querySelector(".app");
      if (!argoConnected) {
        appElement.classList.add("argo-onboarding");
        appElement.classList.remove("ai-mode");
        appElement.classList.remove("weekly-plan-screen");
        navigation.innerHTML = "";
        document.querySelector("#ai-nav").hidden = true;
        document.querySelector("#exit-ai-top").hidden = true;
        content.innerHTML = argoSetupPage();
        return;
      }
      appElement.classList.remove("argo-onboarding");
      renderNavigation();
      appElement.classList.toggle("ai-mode", aiMode);
      appElement.classList.toggle("weekly-plan-screen", currentPage === "Piano generato");
      content.innerHTML = currentPage === "Compiti" ? tasksPage()
        : currentPage === "Compiti passati" ? previousTasksPage()
        : currentPage === "Promemoria" ? remindersPage()
        : currentPage === "Promemoria passati" ? previousRemindersPage()
        : currentPage === "Calendario" ? calendarPage()
        : currentPage === "Account" ? accountPage()
        : currentPage === "Planning" ? planningPage()
        : currentPage === "Piano generato" ? generatedPlanPage()
        : currentPage === "Chat" ? chatPage()
        : currentPage === "Home" ? homePage()
        : placeholderPage(currentPage);
      updateProfile();
      if (currentPage === "Chat" && geminiApiConfigured) {
        const messageList = document.querySelector("#chat-messages");
        if (messageList) messageList.scrollTop = messageList.scrollHeight;
      }
    }

    function openPage(page) {
      currentPage = page;
      if (["Planning", "Piano generato", "Chat"].includes(page)) aiMode = true;
      else if (page !== "Home" && aiMode) aiMode = false;
      else if (page === "Home") aiMode = false;
      chatStatus = "";
      render();
    }

    navigation.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (!button) return;
      openPage(button.dataset.page);
    });
    document.querySelector(".topbar").addEventListener("click", event => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        openPage(pageButton.dataset.page);
        return;
      }
      if (event.target.closest("[data-exit-planning]")) openPage("Home");
      if (event.target.closest("[data-logout]")) void logout();
    });
    document.querySelector("#ai-nav").addEventListener("click", () => openPage("Home"));
    content.addEventListener("click", event => {
      const profileField = event.target.closest(".profile-field");
      const profileInput = profileField?.querySelector(".profile-input[readonly]");
      if (profileInput) {
        profileInput.readOnly = false;
        profileInput.focus();
        return;
      }
      const profileTextarea = event.target.closest(".profile-input[readonly]");
      if (profileTextarea) {
        profileTextarea.readOnly = false;
        profileTextarea.focus();
        return;
      }
      const profileFileButton = event.target.closest("[data-profile-file]");
      if (profileFileButton) {
        const inputId = profileFileButton.dataset.profileFile === "cover" ? "#profile-cover-file" : "#profile-photo-file";
        document.querySelector(inputId).click();
        return;
      }
      const profileThemeButton = event.target.closest("[data-profile-theme]");
      if (profileThemeButton) {
        account.preferences.theme = profileThemeButton.dataset.profileTheme;
        document.body.dataset.theme = account.preferences.theme;
        profileStatus = persistAccount() ? "Preferenza salvata." : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
        render();
        return;
      }
      const profileToggleButton = event.target.closest("[data-profile-toggle]");
      if (profileToggleButton) {
        const preference = profileToggleButton.dataset.profileToggle;
        account.preferences[preference] = account.preferences[preference] !== true;
        profileStatus = persistAccount() ? "Preferenza salvata su questo dispositivo." : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
        render();
        return;
      }
      const addSubjectButton = event.target.closest("[data-add-subject]");
      if (addSubjectButton) {
        const input = document.querySelector("#new-subject");
        const subject = input ? input.value.trim() : "";
        if (!subject) {
          input?.focus();
          profileStatus = "Seleziona una materia dalla lista.";
          render();
          return;
        }
        if (account.subjects.some(item => normalizeSubject(item) === normalizeSubject(subject))) {
          profileStatus = "Questa materia è già presente.";
          render();
          return;
        }
        if (account.subjects.length >= 20) {
          profileStatus = "Puoi salvare fino a 20 materie preferite.";
          render();
          return;
        }
        account.subjects.push(subject);
        account.subjects = account.subjects.sort((a, b) => a.localeCompare(b, "it"));
        profileStatus = persistAccount() ? "Materia aggiunta." : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
        render();
        return;
      }
      if (event.target.closest("[data-profile-subject-card]") && !subjectsEditorOpen) {
        subjectsEditorOpen = true;
        render();
        document.querySelector("#new-subject")?.focus();
        return;
      }
      const removeSubjectButton = event.target.closest("[data-remove-subject]");
      if (removeSubjectButton) {
        account.subjects.splice(Number(removeSubjectButton.dataset.removeSubject), 1);
        profileStatus = persistAccount() ? "Materia rimossa." : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
        render();
        return;
      }
      const homeTaskFilterButton = event.target.closest("[data-home-task-filter]");
      if (homeTaskFilterButton) {
        homeTaskFilter = homeTaskFilterButton.dataset.homeTaskFilter;
        render();
        return;
      }
      const homeReminderFilterButton = event.target.closest("[data-home-reminder-filter]");
      if (homeReminderFilterButton) {
        homeReminderFilter = homeReminderFilterButton.dataset.homeReminderFilter;
        render();
        return;
      }
      const taskFilterButton = event.target.closest("[data-task-filter]");
      if (taskFilterButton) {
        taskStatusFilter = taskFilterButton.dataset.taskFilter;
        render();
        return;
      }
      const taskSubjectButton = event.target.closest("[data-task-subject]");
      if (taskSubjectButton) {
        taskSubjectFilter = taskSubjectFilter === taskSubjectButton.dataset.taskSubject ? "" : taskSubjectButton.dataset.taskSubject;
        render();
        return;
      }
      if (event.target.closest("[data-clear-task-subject]")) {
        taskSubjectFilter = "";
        render();
        return;
      }
      if (event.target.closest("[data-clear-task-filters]")) {
        taskSubjectFilter = "";
        taskSelectedDate = "";
        render();
        return;
      }
      if (event.target.closest("[data-clear-task-date]")) {
        taskSelectedDate = "";
        taskSubjectFilter = "";
        taskStatusFilter = "all";
        render();
        return;
      }
      const reminderFilterButton = event.target.closest("[data-reminder-filter]");
      if (reminderFilterButton) {
        reminderFilter = reminderFilterButton.dataset.reminderFilter;
        render();
        return;
      }
      if (event.target.closest("[data-clear-reminder-filters]")) {
        reminderSelectedDate = "";
        reminderFilter = "all";
        render();
        return;
      }
      if (event.target.closest("[data-clear-reminder-date]")) {
        reminderSelectedDate = "";
        reminderFilter = "all";
        render();
        return;
      }
      const reminderViewButton = event.target.closest("[data-reminder-view]");
      if (reminderViewButton) {
        reminderViewMode = reminderViewButton.dataset.reminderView;
        render();
        return;
      }
      const reminderGroupButton = event.target.closest("[data-reminder-group]");
      if (reminderGroupButton) {
        const key = reminderGroupButton.dataset.reminderGroup;
        if (collapsedTaskGroups.has(key)) collapsedTaskGroups.delete(key);
        else collapsedTaskGroups.add(key);
        render();
        return;
      }
      if (event.target.closest("[data-add-reminder]")) {
        document.querySelector("#reminder-form-error").textContent = "";
        document.querySelector("#reminder-dialog").showModal();
        document.querySelector('#reminder-form input[name="title"]').focus();
        return;
      }
      if (event.target.closest("[data-close-reminder]")) {
        document.querySelector("#reminder-dialog")?.close();
        return;
      }
      const taskViewButton = event.target.closest("[data-task-view]");
      if (taskViewButton) {
        taskViewMode = taskViewButton.dataset.taskView;
        render();
        return;
      }
      const taskGroupButton = event.target.closest("[data-task-group]");
      if (taskGroupButton) {
        const key = taskGroupButton.dataset.taskGroup;
        if (collapsedTaskGroups.has(key)) collapsedTaskGroups.delete(key);
        else collapsedTaskGroups.add(key);
        render();
        return;
      }
      if (event.target.closest("[data-add-task]")) {
        document.querySelector("#task-form-error").textContent = "";
        document.querySelector("#task-dialog").showModal();
        document.querySelector('#task-form input[name="subject"]').focus();
        return;
      }
      if (event.target.closest("[data-close-task]")) {
        document.querySelector("#task-dialog")?.close();
        return;
      }
      if (event.target.closest("[data-open-planning]")) {
        aiMode = true;
        openPage("Planning");
        return;
      }
      if (event.target.closest("[data-generate-plan]")) {
        void generateStudyPlan();
        return;
      }
      if (event.target.closest("[data-regenerate-plan]")) {
        void generateStudyPlan();
        return;
      }
      if (event.target.closest("[data-back-planning]")) {
        openPage("Planning");
        return;
      }
      if (event.target.closest("[data-save-study-plan]")) {
        try {
          localStorage.setItem("diario-study-plan", JSON.stringify({
            savedAt: new Date().toISOString(),
            input: generatedPlanInput,
            plan: generatedPlan
          }));
          planSaveStatus = "Piano salvato su questo dispositivo.";
        } catch (error) {
          planSaveStatus = "Salvataggio non riuscito. Verifica lo spazio disponibile nel browser.";
          console.error("Non è stato possibile salvare il piano di studio.", error);
        }
        render();
        return;
      }
      if (event.target.closest("[data-print-plan]")) {
        window.print();
        return;
      }
      const planViewButton = event.target.closest("[data-plan-view]");
      if (planViewButton) {
        planViewMode = planViewButton.dataset.planView;
        planViewStart = 0;
        render();
        return;
      }
      const planShiftButton = event.target.closest("[data-plan-shift]");
      if (planShiftButton) {
        const step = planViewMode === "week" ? 7 : 11;
        const maxStart = Math.floor(Math.max(0, (generatedPlan?.days.length || 0) - 1) / step) * step;
        planViewStart = Math.min(maxStart, Math.max(0, planViewStart + Number(planShiftButton.dataset.planShift) * step));
        render();
        return;
      }
      if (event.target.closest("[data-save-gemini-key]")) {
        void saveGeminiKey();
        return;
      }
      const completeButton = event.target.closest("[data-complete]");
      if (completeButton) {
        const item = assignments.find(assignment => assignment.id === completeButton.dataset.complete);
        if (item && taskIsComplete(item)) {
          completed.delete(item.id);
        } else {
          completed.add(completeButton.dataset.complete);
        }
        try {
          localStorage.setItem("diario-argo-completed", JSON.stringify([...completed]));
        } catch (error) {
          console.warn("Non è stato possibile salvare i compiti nel browser.", error);
        }
        render();
        return;
      }
      const goButton = event.target.closest("[data-go]");
      if (goButton) {
        openPage(goButton.dataset.go);
        return;
      }
      const monthButton = event.target.closest("[data-month-shift]");
      if (monthButton) {
        calendarMonth.setMonth(calendarMonth.getMonth() + Number(monthButton.dataset.monthShift));
        selectedDay = Math.min(selectedDay, new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 0).getDate());
        render();
        return;
      }
      const dayButton = event.target.closest("[data-day]");
      if (dayButton) {
        selectedDay = Number(dayButton.dataset.day);
        calendarMonth = new Date(Number(dayButton.dataset.year), Number(dayButton.dataset.month), 1);
        if (currentPage === "Compiti" || currentPage === "Compiti passati") {
          taskSelectedDate = `${dayButton.dataset.year}-${String(Number(dayButton.dataset.month) + 1).padStart(2, "0")}-${String(selectedDay).padStart(2, "0")}`;
          taskStatusFilter = "all";
        } else if (currentPage === "Promemoria" || currentPage === "Promemoria passati") {
          reminderSelectedDate = `${dayButton.dataset.year}-${String(Number(dayButton.dataset.month) + 1).padStart(2, "0")}-${String(selectedDay).padStart(2, "0")}`;
          reminderFilter = "all";
        }
        render();
      }
      const statCard = event.target.closest("[data-stat-page]");
      if (statCard) {
        currentPage = statCard.dataset.statPage;
        render();
      }
    });
    content.addEventListener("submit", event => {
      if (event.target.id === "chat-form") {
        event.preventDefault();
        void sendChatMessage();
        return;
      }
      if (event.target.id === "argo-form") {
        event.preventDefault();
        void syncArgo(event.target);
        return;
      }
      if (event.target.id === "task-form") {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const subject = String(formData.get("subject") || "").trim();
        const title = String(formData.get("title") || "").trim();
        const detail = String(formData.get("detail") || "").trim();
        const due = String(formData.get("due") || "");
        const priority = String(formData.get("priority") || "media");
        const dueDate = dateFromISO(due);
        const error = document.querySelector("#task-form-error");
        if (!subject || !title || !dueDate || dayOffsetForISO(due) < 0 || !["alta", "media", "bassa"].includes(priority)) {
          error.textContent = "Controlla materia, titolo, scadenza futura e priorità.";
          return;
        }
        const task = {
          id: `local-${globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`}`,
          subject,
          title,
          detail,
          due,
          priority
        };
        localTasks.push(task);
        if (!persistLocalTasks()) {
          localTasks.pop();
          error.textContent = "Non è stato possibile salvare il compito su questo dispositivo.";
          return;
        }
        assignments.push(createLocalAssignment(task));
        document.querySelector("#task-dialog").close();
        taskSubjectFilter = "";
        taskSelectedDate = "";
        taskStatusFilter = "all";
        form.reset();
        render();
        return;
      }
      if (event.target.id === "reminder-form") {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const title = String(formData.get("title") || "").trim();
        const detail = String(formData.get("detail") || "").trim();
        const date = String(formData.get("date") || "");
        const time = String(formData.get("time") || "");
        const error = document.querySelector("#reminder-form-error");
        if (!title || !dateFromISO(date) || dayOffsetForISO(date) < 0 || !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) {
          error.textContent = "Inserisci un titolo, una data futura e un orario valido.";
          return;
        }
        const reminder = {
          id: `local-reminder-${globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`}`,
          title,
          detail,
          date,
          time
        };
        localReminders.push(reminder);
        if (!persistLocalReminders()) {
          localReminders.pop();
          error.textContent = "Non è stato possibile salvare il promemoria su questo dispositivo.";
          return;
        }
        reminders.push(createLocalReminder(reminder));
        document.querySelector("#reminder-dialog").close();
        reminderSelectedDate = "";
        reminderFilter = "all";
        form.reset();
        render();
        return;
      }
      if (event.target.id !== "account-form") return;
      event.preventDefault();
      account = readAccountForm(event.target);
      profileStatus = persistAccount()
        ? "Account salvato. Home e profilo sono stati aggiornati."
        : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
      render();
    });
    content.addEventListener("input", event => {
      const form = event.target.form;
      if (form?.id !== "account-form") return;
      const initials = (form.elements.firstName.value.trim().charAt(0) + form.elements.lastName.value.trim().charAt(0) || "S").toLocaleUpperCase("it");
      const profileAvatar = document.querySelector("#profile-avatar-large");
      if (!account.avatarImage) profileAvatar.textContent = initials;
      document.querySelector("#account-preview-name").textContent =
        [form.elements.firstName.value.trim(), form.elements.lastName.value.trim()].filter(Boolean).join(" ") || "Crea il tuo profilo";
      document.querySelector("#account-preview-school").textContent =
        [form.elements.schoolYear.value.trim(), form.elements.school.value.trim()].filter(Boolean).join(" · ") || "Aggiungi scuola e classe";
      if (!form.checkValidity()) return;
      account = readAccountForm(form);
      if (event.target.name === "academicYear") account.academicYearAuto = false;
      profileStatus = persistAccount()
        ? "Account salvato automaticamente."
        : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
      updateProfile();
      updateProfileCompletion();
      const status = document.querySelector("#save-status");
      if (status) {
        status.textContent = profileStatus;
        status.classList.toggle("error", profileStatus.startsWith("Salvataggio non riuscito"));
      }
    });
    content.addEventListener("focusout", event => {
      const field = event.target.closest(".profile-input:not([readonly])");
      if (!field || field.id === "new-subject") return;
      if (field.form?.id === "account-form") {
        if (!field.form.checkValidity()) {
          profileStatus = "Completa i campi richiesti e correggi i dati prima di uscire.";
          const status = document.querySelector("#save-status");
          if (status) status.textContent = profileStatus;
          return;
        }
        account = readAccountForm(field.form);
        if (field.name === "academicYear") account.academicYearAuto = false;
        profileStatus = persistAccount()
          ? "Modifiche salvate automaticamente."
          : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
        const status = document.querySelector("#save-status");
        if (status) {
          status.textContent = profileStatus;
          status.classList.toggle("error", profileStatus.startsWith("Salvataggio non riuscito"));
        }
      }
      field.readOnly = true;
    });
    content.addEventListener("change", async event => {
      const imageField = event.target;
      if (["task-sort", "task-sort-past"].includes(imageField.id)) {
        taskSortOrder = imageField.value;
        render();
        return;
      }
      if (imageField.id === "reminder-sort") {
        reminderSortOrder = imageField.value;
        render();
        return;
      }
      if (!["profile-cover-file", "profile-photo-file"].includes(imageField.id)) return;
      const file = imageField.files?.[0];
      if (!file) return;
      try {
        const field = imageField.id === "profile-cover-file" ? "coverImage" : "avatarImage";
        account[field] = await resizeProfileImage(file, field === "coverImage" ? 1400 : 480, field === "coverImage" ? 500 : 480);
        profileStatus = persistAccount()
          ? "Immagine salvata su questo dispositivo."
          : "Salvataggio non riuscito. Verifica lo spazio disponibile nel browser.";
      } catch (error) {
        profileStatus = error.message;
        console.error("Non è stato possibile aggiornare l'immagine del profilo.", error);
      } finally {
        imageField.value = "";
        updateProfile();
        render();
      }
    });
    content.addEventListener("keydown", event => {
      if (event.target.id === "chat-input" && event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        event.target.form.requestSubmit();
      }
    });
    search.addEventListener("input", render);
    document.querySelector("#auth-form").addEventListener("submit", event => {
      event.preventDefault();
      void login();
    });
    void refreshAppConfig();
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("/sw.js").catch(error => {
        console.error("Non è stato possibile attivare la modalità installabile.", error);
      });
    }
  </script>
</body>
</html>
